name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Cancel any in-flight run for the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Format + typo gate. Runs on a single OS — neither moon fmt nor
  # typos has OS-specific output, so a single matrix entry is enough.
  lint:
    name: lint (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install moon
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Cache moon deps
        uses: actions/cache@v4
        with:
          path: |
            .mooncakes
            .moon-agent-cache
            .proton
            ~/.proton/store
          key: moon-cache-${{ runner.os }}-${{ hashFiles('moon.mod', 'app_moui/moon.mod') }}
          restore-keys: moon-cache-${{ runner.os }}-

      # A cold runner has an empty registry index, so any dependency
      # that must come from mooncakes.io fails to resolve until the
      # index is fetched. `.mooncakes/` is gitignored, so there is no
      # vendored copy to fall back on. This failure mode is invisible
      # locally because a developer machine has a warm
      # `~/.moon/registry`; upstream's own setup action
      # (moonbit-docs .github/actions/setup) does the same thing.
      - name: Fetch registry index
        run: moon update

      - name: moon fmt --check
        run: moon fmt --check

      - name: Install typos-cli
        run: cargo install typos-cli --locked
        # Fall back to GitHub-hosted download if cargo install is unreliable.
        continue-on-error: true
        shell: bash

      - name: typos
        run: |
          if command -v typos >/dev/null 2>&1; then
            typos --config _typos.toml
          else
            echo "typos not available; skipping"
          fi

  # Build + test on Linux. proton packaging is Windows-only and is
  # covered by the windows job below.
  test-linux:
    name: test (ubuntu, native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install moon
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Cache moon deps
        uses: actions/cache@v4
        with:
          path: |
            .mooncakes
            .moon-agent-cache
            .proton
            ~/.proton/store
          key: moon-cache-${{ runner.os }}-${{ hashFiles('moon.mod', 'app_moui/moon.mod') }}
          restore-keys: moon-cache-${{ runner.os }}-

      # See the note in the lint job: a cold runner's registry index is
      # empty, and `.mooncakes/` is gitignored, so `moon check` cannot
      # resolve the mooncakes.io dependencies without this.
      - name: Fetch registry index
        run: moon update

      # Proton's module prebuild (proton/build.mjs) unconditionally runs
      # `pkg-config --cflags gtk+-3.0 x11` on Linux and throws if either
      # package is missing. A stock ubuntu runner has neither, which is
      # what produced:
      #   Error: Package gtk+-3.0 was not found in the pkg-config search path
      #   Failed to run prebuild script for module moonbit-community/proton
      #
      # This prebuild is **module-level**: it runs for any `moon test` /
      # `moon build` in this module. Scoping the test to specific
      # packages with -p does NOT avoid it, and the lint job needs
      # neither this nor the SDK below because `moon fmt --check` does
      # not build.
      - name: Install Proton's Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-3-dev libx11-dev

      # Populates the CEF SDK store that the same prebuild points at with
      # -I flags: ~/.proton/store/<platform>/cef-<sha>-layout-<n>/sdk.
      # The SDK alone is ~445 MB, which is why the cache paths above
      # include the store — otherwise every run re-downloads it.
      - name: Fetch the Proton CEF SDK
        run: proton_cli cef setup

      - name: moon check
        run: moon check --target native --diagnostic-limit 40

      # Scoped to the two packages that hold every test (55 of them:
      # the root package's blackbox drivers plus extensions/labeler's
      # suite). `app/` is the Proton/CEF executable and contributes no
      # tests, so excluding it just keeps the test build smaller.
      # Verified: this exact invocation runs 55/55 locally, the same
      # count as an unscoped `moon test`.
      #
      # Correction to an earlier claim in this file: the scoping does
      # NOT avoid the Proton CEF work. That is a **module-level**
      # prebuild, so it runs for any `moon test` / `moon build` in this
      # module no matter which packages are selected — which is why the
      # ubuntu job needed the GTK packages and the CEF SDK step above,
      # and why the windows job needs the SDK step.
      - name: moon test
        run: >-
          moon test
          -p riantr/moonbit_labeler
          -p riantr/moonbit_labeler/extensions/labeler
          --target native --diagnostic-limit 40

  # Windows run builds the CEF/Proton exe + verifies the smoke
  # pipeline (frontend build + staging + CDP screenshot).
  test-windows:
    name: test + proton package (windows)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Install moon
        # The Windows installer is `install/powershell.ps1`. The URL
        # this step used to name — `install/windows.ps1` — does not
        # exist, and that is why every run in this repo's history has
        # failed at this step with exit code 1, before moon was ever
        # installed. Confirmed three ways: MoonBit's own docs and
        # download page both name `powershell.ps1`; moonbitlang/moon
        # installs moon on its Windows runners with exactly this URL;
        # and `https://cli.moonbitlang.com/install/powershell.ps1`
        # returns 200 (3218 bytes) while `install/windows.ps1` does
        # not resolve.
        run: |
          Invoke-WebRequest -UseBasicParsing -Uri https://cli.moonbitlang.com/install/powershell.ps1 -OutFile install.ps1
          powershell -ExecutionPolicy Bypass -File install.ps1
          "$env:USERPROFILE\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Cache moon deps
        uses: actions/cache@v4
        with:
          path: |
            .mooncakes
            .moon-agent-cache
            .proton
          key: moon-cache-${{ runner.os }}-${{ hashFiles('moon.mod', 'app_moui/moon.mod', 'proton.project.json') }}
          restore-keys: moon-cache-${{ runner.os }}-

      # Same cold-runner registry problem as the two ubuntu jobs.
      - name: Fetch registry index
        run: moon update

      # The Windows half of the CEF SDK problem. proton/build.mjs adds
      # -I<sdk> where <sdk> is
      #   %USERPROFILE%\.proton\store\win32-x64\cef-<sha>-layout-<n>\sdk
      # and the native stubs #include "include/capi/cef_*_capi.h"
      # relative to it. Without this step that store is empty and the
      # build dies with
      #   C1083: Cannot open include file: 'include/capi/cef_browser_capi.h'
      #
      # Worth stating plainly: the headers are NOT missing from the
      # published proton package. They live in this SDK, which is what
      # `proton_cli cef setup` downloads. It is a missing setup step, not
      # an upstream packaging defect.
      #
      # Also module-level: no -p selection avoids it.
      - name: Fetch the Proton CEF SDK
        run: proton_cli cef setup

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Frontend deps
        working-directory: frontend
        run: npm ci

      - name: moon check
        run: moon check --target native --diagnostic-limit 40

      # Scoped, for the same reason as the ubuntu job's test step.
      - name: moon test
        run: >-
          moon test
          -p riantr/moonbit_labeler
          -p riantr/moonbit_labeler/extensions/labeler
          --target native --diagnostic-limit 40

      # `moon build` and `proton_cli package` build the `app/` package
      # in full, so unlike the scoped test step above they compile every
      # Proton native stub. They are expected to work now that the
      # "Fetch the Proton CEF SDK" step above has populated the SDK
      # store the prebuild points -I at.
      - name: moon build
        run: moon build --target native

      # Proton packaging is the gating release artifact. Use
      # --format app to skip the upstream zip-step bug documented
      # in AGENTS.md; the .zip step is reproduced locally with
      # `_build/package-app.bat` before tagging a release.
      - name: proton_cli package
        run: proton_cli package --format app