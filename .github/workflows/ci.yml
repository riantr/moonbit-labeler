name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Cancel any in-flight run for the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Format + typo gate. Runs on a single OS — neither moon fmt nor
  # typos has OS-specific output, so a single matrix entry is enough.
  lint:
    name: lint (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install moon
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Cache moon deps
        uses: actions/cache@v4
        with:
          path: |
            .mooncakes
            .moon-agent-cache
            .proton
            ~/.proton/store
          key: moon-cache-${{ runner.os }}-${{ hashFiles('moon.mod', 'app_moui/moon.mod') }}
          restore-keys: moon-cache-${{ runner.os }}-

      # A cold runner has an empty registry index, so any dependency
      # that must come from mooncakes.io fails to resolve until the
      # index is fetched. `.mooncakes/` is gitignored, so there is no
      # vendored copy to fall back on. This failure mode is invisible
      # locally because a developer machine has a warm
      # `~/.moon/registry`; upstream's own setup action
      # (moonbit-docs .github/actions/setup) does the same thing.
      - name: Fetch registry index
        run: moon update

      - name: moon fmt --check
        run: moon fmt --check

      - name: Install typos-cli
        run: cargo install typos-cli --locked
        # Fall back to GitHub-hosted download if cargo install is unreliable.
        continue-on-error: true
        shell: bash

      - name: typos
        run: |
          if command -v typos >/dev/null 2>&1; then
            typos --config _typos.toml
          else
            echo "typos not available; skipping"
          fi

  # Build + test on Linux. proton packaging is Windows-only and is
  # covered by the windows job below.
  test-linux:
    name: test (ubuntu, native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install moon
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Cache moon deps
        uses: actions/cache@v4
        with:
          path: |
            .mooncakes
            .moon-agent-cache
            .proton
            ~/.proton/store
          key: moon-cache-${{ runner.os }}-${{ hashFiles('moon.mod', 'app_moui/moon.mod') }}
          restore-keys: moon-cache-${{ runner.os }}-

      # See the note in the lint job: a cold runner's registry index is
      # empty, and `.mooncakes/` is gitignored, so `moon check` cannot
      # resolve the mooncakes.io dependencies without this.
      - name: Fetch registry index
        run: moon update

      # Proton's module prebuild (proton/build.mjs) unconditionally runs
      # `pkg-config --cflags gtk+-3.0 x11` on Linux and throws if either
      # package is missing. A stock ubuntu runner has neither, which is
      # what produced:
      #   Error: Package gtk+-3.0 was not found in the pkg-config search path
      #   Failed to run prebuild script for module moonbit-community/proton
      #
      # This prebuild is **module-level**: it runs for any `moon test` /
      # `moon build` in this module. Scoping the test to specific
      # packages with -p does NOT avoid it, and the lint job needs
      # neither this nor the SDK below because `moon fmt --check` does
      # not build.
      - name: Install Proton's Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-3-dev libx11-dev

      # No proton_cli, and no CEF SDK, in this job -- both are
      # deliberately unnecessary here.
      #
      # An earlier revision ran `proton_cli cef setup` here and it died
      # with `proton_cli: command not found` (exit 127). The conclusion
      # drawn at the time -- that proton_cli is not installable in CI --
      # was WRONG. It is an ordinary mooncakes binary package; the
      # Proton README installs it with
      #
      #   moon install moonbit-community/proton_cli@<version>
      #
      # which drops the binary in ~/.moon/bin, already on GITHUB_PATH.
      # The original step failed only because it never installed it.
      #
      # It is still not wanted in this job, for a different reason. The
      # CEF SDK is read at **link** time only: proton/build.mjs computes
      # ~/.proton/store/<platform>/cef-<sha>-layout-<n>/sdk and passes it
      # to the linker in a link_configs entry keyed to exactly one
      # package,
      #
      #   moonbit-community/proton/internal/native/ffi
      #
      # and nothing checked or tested here reaches that package. The two
      # tested packages depend on `proton/extension`, whose imports are
      # async, proton/command, proton_ffi and proton_contract.
      #
      # Measured rather than assumed, because a warm _build/ hides this:
      # with PROTON_RUNTIME_STORE pointed at an empty directory and
      # --target-dir at a fresh path (forcing a real cold build, 63
      # tasks), `moon check --target native` exits 0. Repeating that
      # with the warm cache reports "ran 2 tasks" and proves nothing.
      #
      # The GTK packages above are a separate matter and are still
      # required: the prebuild is module-level, so it runs for the whole
      # proton module as soon as any package in it is built, and
      # platformConfig() calls pkg-config unconditionally on Linux.

      - name: moon check
        run: moon check --target native --diagnostic-limit 40

      # Scoped to the two packages that hold every test (55 of them:
      # the root package's blackbox drivers plus extensions/labeler's
      # suite). `app/` is the Proton/CEF executable and contributes no
      # tests, so excluding it just keeps the test build smaller.
      # Verified: this exact invocation runs 55/55 locally, the same
      # count as an unscoped `moon test`.
      #
      # Correction to an earlier claim in this file: the scoping does
      # NOT avoid the Proton CEF work. That is a **module-level**
      # prebuild, so it runs for any `moon test` / `moon build` in this
      # module no matter which packages are selected — which is why the
      # ubuntu job needed the GTK packages and the CEF SDK step above,
      # and why the windows job needs the SDK step.
      - name: moon test
        run: >-
          moon test
          -p riantr/moonbit_labeler
          -p riantr/moonbit_labeler/extensions/labeler
          --target native --diagnostic-limit 40

  # Windows run builds the CEF/Proton exe + verifies the smoke
  # pipeline (frontend build + staging + CDP screenshot).
  test-windows:
    name: test + proton package (windows)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Install moon
        # The Windows installer is `install/powershell.ps1`. The URL
        # this step used to name — `install/windows.ps1` — does not
        # exist, and that is why every run in this repo's history has
        # failed at this step with exit code 1, before moon was ever
        # installed. Confirmed three ways: MoonBit's own docs and
        # download page both name `powershell.ps1`; moonbitlang/moon
        # installs moon on its Windows runners with exactly this URL;
        # and `https://cli.moonbitlang.com/install/powershell.ps1`
        # returns 200 (3218 bytes) while `install/windows.ps1` does
        # not resolve.
        run: |
          Invoke-WebRequest -UseBasicParsing -Uri https://cli.moonbitlang.com/install/powershell.ps1 -OutFile install.ps1
          powershell -ExecutionPolicy Bypass -File install.ps1
          "$env:USERPROFILE\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Cache moon deps
        uses: actions/cache@v4
        with:
          path: |
            .mooncakes
            .moon-agent-cache
            .proton
            # The CEF runtime store: ~445 MB per platform, and
            # `proton_cli cef setup` below repopulates it every run
            # unless it is cached. Proton 0.3.3 moved this out of the
            # repo (.proton/runtimes/) to
            # ~/.proton/store/<platform>/cef-<sha>-layout-<n>/sdk, so
            # the repo-local .proton entry above no longer covers it.
            ~/.proton/store
          key: moon-cache-${{ runner.os }}-${{ hashFiles('moon.mod', 'app_moui/moon.mod', 'proton.project.json') }}
          restore-keys: moon-cache-${{ runner.os }}-

      # Same cold-runner registry problem as the two ubuntu jobs.
      - name: Fetch registry index
        run: moon update

      # proton_cli is an ordinary mooncakes binary package. Per the
      # Proton README the install is:
      #
      #   moon install moonbit-community/proton_cli@<version>
      #
      # which puts the executable in ~/.moon/bin -- already on
      # GITHUB_PATH from the "Install moon" step above, so nothing else
      # is needed to make it resolvable on PATH.
      #
      # The version is pinned to the one in moon.mod on purpose. The
      # README states the rule: "All published Proton modules use one
      # lockstep version. The CLI, framework, extensions, packager, code
      # generator, and CEF setup tool must come from the same release."
      # An unpinned `moon install moonbit-community/proton_cli` would
      # float to whatever is newest and silently drift out of lockstep
      # the next time proton itself is bumped. Keeping the pin here
      # means the two have to be updated together, visibly.
      - name: Install proton_cli
        run: moon install moonbit-community/proton_cli@0.3.4

      # Populates the CEF runtime store that proton/build.mjs points the
      # linker at: ~/.proton/store/win32-x64/cef-<sha>-layout-<n>/sdk.
      # The native stubs under proton/internal/native/ffi #include
      # "include/capi/cef_*_capi.h" relative to it, so without this the
      # `moon build` below dies with
      #   C1083: Cannot open include file: 'include/capi/cef_browser_capi.h'
      #
      # The SDK is ~445 MB, which is why ~/.proton/store is in the cache
      # paths above -- otherwise every run re-downloads it. Only
      # `moon build` and `proton_cli package` need it; `moon check` and
      # `moon test` were measured not to (see the test-linux job).
      - name: Fetch the Proton CEF SDK
        run: proton_cli cef setup

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Frontend deps
        working-directory: frontend
        run: npm ci

      - name: moon check
        run: moon check --target native --diagnostic-limit 40

      # Scoped, for the same reason as the ubuntu job's test step.
      - name: moon test
        run: >-
          moon test
          -p riantr/moonbit_labeler
          -p riantr/moonbit_labeler/extensions/labeler
          --target native --diagnostic-limit 40

      # Restored. These compile app/ -- the only package in the module
      # that reaches proton/internal/native/ffi -- so unlike check and
      # test above they genuinely require the CEF SDK, which is why this
      # is the only job that installs proton_cli and runs `cef setup`.
      # Verified locally against Proton 0.3.4: `moon build --target
      # native` exits 0 (141 tasks, 0 errors).
      - name: moon build
        run: moon build --target native

      # --format app skips the upstream zip-step bug documented in
      # AGENTS.md (`create_windows_zip` passes a `.staging` suffix to
      # Compress-Archive, which only accepts `.zip`). The sibling .zip
      # is produced locally by `_build/package-app.bat`.
      #
      # Note this does NOT gate the mooncakes release: publish.yml
      # ships the pure-MoonBit package and never invokes proton_cli.
      # This is coverage that the Windows exe actually builds.
      - name: proton_cli package
        run: proton_cli package --format app
