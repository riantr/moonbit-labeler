name: publish

# Publishes the root module (riantr/moonbit_labeler) to mooncakes.io.
#
# Triggered two ways on purpose:
#
#   - `push` on a `v*` tag — the ordinary path.
#   - `workflow_dispatch` with an explicit version — for a tag that was
#     pushed before this workflow existed. v0.2.12 is that case: the tag
#     is already on github and will never re-fire a tag-push trigger, so
#     publishing it means dispatching this workflow by hand rather than
#     deleting and re-pushing a tag that other people may have already
#     fetched.
#
# This is deliberately NOT gated on the CI workflow passing. A tag push
# is itself the release authorisation, and gating on CI would mean a
# repository whose tests are currently red can never ship at all — the
# two concerns should be fixed independently.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version already set in moon.mod, e.g. 0.2.12"
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    # Least privilege: this job only reads the repo. It does not push,
    # tag, or create releases.
    permissions:
      contents: read
    # One publish at a time. `cancel-in-progress: false` matters —
    # cancelling a half-finished publish would leave the registry in a
    # state we cannot reason about.
    concurrency:
      group: mooncakes-publish
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - name: Install moon
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      # A cold runner has an empty registry index and `.mooncakes/` is
      # gitignored, so dependency resolution fails until this runs.
      # Same reason the ci.yml jobs need it.
      - name: Fetch registry index
        run: moon update

      # `moon publish` has no --token flag; it reads ~/.moon/credentials.json.
      # That secret carries the **whole file** as its value, in the
      # shape `moon login` writes:
      #
      #     { "token": "...", "username": "..." }
      #
      # so it is written through verbatim. An earlier revision wrapped it
      # as printf '{"token":"%s"}' "$SECRET", which would have turned
      # the whole JSON object into the *string value* of a token field —
      # a plausible-looking file that cannot authenticate.
      #
      # Only one secret is needed. The username is not consulted for
      # publishing: measured against mooncakes.io with the real token,
      # a correct username, a wrong username, and no username field at
      # all all returned 202 Accepted. It rides along because it is part
      # of the file, not because anything needs it.
      #
      # The check below parses the file and prints only the key names and
      # the token's length — never its value.
      - name: Write mooncakes credentials
        env:
          MOON_CAKES_CREDENTIALS: ${{ secrets.MOONCAKES_RIANTR_TOKEN }}
        run: |
          if [ -z "$MOON_CAKES_CREDENTIALS" ]; then
            echo "::error::MOONCAKES_RIANTR_TOKEN is not set on this repository"
            exit 1
          fi
          mkdir -p "$HOME/.moon"
          printf '%s' "$MOON_CAKES_CREDENTIALS" > "$HOME/.moon/credentials.json"
          python3 - <<'PY'
          import json, os, sys
          path = os.path.expanduser("~/.moon/credentials.json")
          try:
              with open(path, encoding="utf-8") as fh:
                  doc = json.load(fh)
          except Exception as exc:
              print(f"::error::the secret is not valid JSON: {exc}")
              sys.exit(1)
          if not isinstance(doc, dict) or not doc.get("token"):
              print("::error::the secret has no non-empty 'token' field")
              sys.exit(1)
          # Key names and the token's length only. Never the value.
          print("credentials valid: keys=" + str(sorted(doc.keys())) +
                " token length=" + str(len(doc["token"])))
          PY

      # The single most useful guard in this workflow. A tag that
      # disagrees with moon.mod publishes the wrong thing silently:
      # moon publishes whatever version moon.mod says, and the tag is
      # just a label nobody checks against it. That mismatch is exactly
      # how a release ends up tagged v0.2.12 while the registry gets
      # 0.2.11 again.
      - name: Resolve and check the release version
        id: version
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -eu
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            release="$DISPATCH_VERSION"
          else
            release="${REF_NAME#v}"
          fi
          actual=$(grep -E '^version' moon.mod | head -1 | cut -d'"' -f2)
          echo "release requested : $release"
          echo "moon.mod says     : $actual"
          if [ "$release" != "$actual" ]; then
            echo "::error::Tag/dispatch version '$release' does not match moon.mod '$actual'. Fix moon.mod before tagging — the registry publishes moon.mod's value, not the tag's."
            exit 1
          fi
          echo "version=$release" >> "$GITHUB_OUTPUT"

      # `moon publish --dry-run` really authenticates (a bad token
      # yields "Server status: 401 Unauthorized, detail: Invalid API
      # token") but has no registry side effects, so a credential
      # failure is caught here rather than half way through a publish.
      #
      # The exit code is NOT a signal. Measured on moon 0.1.20260920
      # against mooncakes.io with a working token, a fully successful
      # dry run prints
      #
      #     Check passed
      #     Server status: 202 Accepted, detail: Dry run completed
      #     successfully. No changes were made. ...
      #     Error: `moon publish` failed
      #
      # and still exits non-zero (255 on ubuntu, observed locally too).
      # The CLI appears to read the dry run's "no changes" state as a
      # failed publish. So the exit code is discarded and the decision
      # is made on the server's own response text, which does
      # distinguish the two cases: 202 means the token was accepted.
      #
      # `2>&1` matters — this CLI writes these lines to stderr, so a
      # stdout-only capture would see an empty log and fail the grep.
      - name: Verify credentials (dry run)
        run: |
          moon publish --dry-run --verbose 2>&1 | tee dryrun.log || true
          if grep -q "Server status: 202 Accepted" dryrun.log; then
            echo "credentials accepted by the server (dry run, no side effects)"
          else
            echo "::error::the dry run did not confirm credentials with the server"
            grep -E "Server status|Error" dryrun.log || echo "(no server response in the log)"
            exit 1
          fi

      # Same reasoning applies to the real publish, and it is safer to
      # assume the same bug is present until it is measured otherwise:
      # if `moon publish` also reports failure on a successful upload,
      # failing the job here would mark a completed release as broken
      # and never reach the registry check below.
      #
      # Swallowing the exit code is only safe because the next step is
      # the authority: `moon view --versions` reads mooncakes.io with no
      # credentials at all. If the upload really did fail, 0.2.12 will
      # not be in that listing and the job fails there instead. The
      # warning line keeps the real exit code visible in the log rather
      # than hiding it.
      - name: Publish
        run: |
          moon publish --verbose 2>&1 | tee publish.log \
            || echo "::warning::moon publish exited $? - the registry check below is authoritative"

      # The authority for whether anything actually landed. It reads
      # mooncakes.io with no credentials at all, so it cannot be fooled
      # by a publish command that reported success or failure.
      #
      # `grep -x`, not `grep`: the match is anchored to a whole line
      # because `moon view --versions` prints one version per line, and
      # an unanchored substring match is the exact failure this workflow
      # exists to prevent — checking for `0.2.1` finds `0.2.10` and
      # declares a release that never happened to be live.
      - name: Verify the version is on the registry
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "published versions of riantr/moonbit_labeler:"
          moon view riantr/moonbit_labeler --versions
          if moon view riantr/moonbit_labeler --versions | grep -qx "$VERSION"; then
            echo "::notice::$VERSION is live on mooncakes.io"
          else
            echo "::error::$VERSION does not appear in the registry listing above"
            exit 1
          fi